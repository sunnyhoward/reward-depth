[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-kfac-ewc"
version = "0.1.0"
description = "Generative replay and K-FAC EWC for causal language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
]

[project.optional-dependencies]
huggingface = [
  "transformers>=4.44",
  "peft>=0.12",
]
test = [
  "pytest>=7",
]

[project.scripts]
replay-kfac-ewc = "replay_kfac_ewc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
